apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: biodiversity
  name: wetlands-v2
  labels:
    app: wetlands-v2
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wetlands-v2
  template:
    metadata:
      labels:
        app: wetlands-v2
    spec:
      initContainers:
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          git clone --depth 1 https://github.com/boettiger-lab/wetlands-v2.git /tmp/repo
          cp /tmp/repo/index.html /usr/share/nginx/html/
          cp /tmp/repo/layers-input.json /usr/share/nginx/html/
          cp /tmp/repo/system-prompt.md /usr/share/nginx/html/
          # Basin explorer (glen-charts): page, theme, config and precomputed data
          mkdir -p /usr/share/nginx/html/explorer
          cp -r /tmp/repo/explorer/index.html /tmp/repo/explorer/app.css \
                /tmp/repo/explorer/config /tmp/repo/explorer/data /usr/share/nginx/html/explorer/
          # The shared nginx snippets (glen-ops#340), pinned like the GLEN version.
          git clone --depth 1 --branch nginx-v2 https://github.com/SchmidtDSE/glen-template.git /tmp/glen
          cp /tmp/glen/nginx/* /glen-nginx/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: glen-nginx
          mountPath: /glen-nginx
      containers:
      - name: nginx
        image: nginx:1.31.9-alpine
        ports:
        - containerPort: 80
        env:
        - name: TMPDIR
          value: "/tmp"
        # Per-app values for the shared nginx snippets (glen-template nginx/render.sh).
        - name: GLEN_APP
          value: "wetlands-v2"
        - name: LLM_UPSTREAM
          value: "http://open-llm-proxy.biodiversity.svc.cluster.local:8002"
        - name: MCP_UPSTREAM
          value: "http://mcp-server-duckdb.biodiversity.svc.cluster.local:8000"
        - name: MCP_HOST
          value: "duckdb-mcp.nrp-nautilus.io"
        - name: MCP_TILES_SOURCE
          value: "https://duckdb-mcp.nrp-nautilus.io/tiles/"
        # Same-origin MCP path: nginx proxies it to the shared server and
        # attaches the bearer token, so the browser never holds the token
        # (geo-query#453). Absolute, because GLEN does new URL(mcp_url).
        - name: MCP_SERVER_URL
          value: "https://wetlands.nrp-nautilus.io/api/mcp"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: duckdb-mcp-auth
              key: MCP_AUTH_TOKEN
        - name: PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: open-llm-proxy-app-keys
              key: wetlands-v2
              optional: true
        # Renders the shared snippets and this app's server block, writes
        # config.json, and starts nginx.
        command: ["sh", "/glen-nginx/render.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: glen-nginx
          mountPath: /glen-nginx
          readOnly: true
        - name: config-template
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: config-template
        configMap:
          name: wetlands-v2-config
      - name: nginx-template
        configMap:
          name: wetlands-v2-nginx
      - name: nginx-conf-d
        emptyDir: {}
      - name: glen-nginx
        emptyDir: {}
